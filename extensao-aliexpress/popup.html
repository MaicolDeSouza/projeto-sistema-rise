<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Rise AliExpress</title>
    <style>
      body { width: 320px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #1f2937; }
      h1 { margin: 0 0 10px; font-size: 15px; }
      button { width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .situacao { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f3f4f6; font-variant-numeric: tabular-nums; }
      .ok { background: #ecfdf5; color: #065f46; }
      .erro { background: #fef2f2; color: #991b1b; }
      .aviso { margin-top: 6px; color: #92400e; font-size: 12px; }
      details { margin-top: 12px; }
      summary { cursor: pointer; color: #6b7280; }
      label { display: block; margin-top: 8px; font-size: 12px; color: #374151; }
      input { box-sizing: border-box; width: 100%; margin-top: 3px; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; font: inherit; }
      .salvar { margin-top: 8px; background: #374151; }
    </style>
  </head>
  <body>
    <h1>Rise AliExpress</h1>
    <button id="enviar" type="button">Enviar ao Rise</button>
    <div id="situacao" class="situacao" hidden></div>
    <details id="config">
      <summary>Configuração</summary>
      <label>Endereço do Rise <input id="endereco" type="url" placeholder="https://rise.4hobby.com.br" /></label>
      <label>Chave da extensão <input id="chave" type="password" autocomplete="off" placeholder="rise_ali_…" /></label>
      <button id="salvar" class="salvar" type="button">Salvar</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
